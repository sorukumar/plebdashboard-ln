<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRank – Plebdashboard</title>

    <!-- Bitcoin Data Labs styles -->
    <link rel="stylesheet" href="https://bitcoindatalabs.org/styles/styles.css" onerror="this.onerror=null;this.href='https://sorukumar.github.io/Bitcoin-Data-Labs/styles/styles.css'">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Local styles -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/node-rank.css">
    <link rel="stylesheet" href="styles/components.css">

</head>

<body class="has-fixed-header">
    <!-- Bitcoin Data Labs Header -->
    <div id="header"></div>

    <div class="main-content">
        <!-- Compact Page Header -->
        <div class="page-header-compact">
            <div class="page-header-main">
                <div class="page-title-group">
                    <h1>PRank</h1>
                    <p>Comprehensive Lightning Network node rankings by Pleb Rank score</p>
                </div>
            </div>
        </div>

        <!-- Table Controls (moved closer to reduce space) -->
        <div class="table-controls">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search by node alias or pubkey..."
                    class="search-input">
                <i class="fas fa-search search-icon"></i>
                <button type="button" class="search-clear-btn" aria-label="Clear search">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <div class="table-container">
            <div id="loading" class="loading-state">
                <div class="loading-content">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading node ranking data...</p>
                </div>
            </div>
            <table id="dataTable" class="data-table" style="display: none;">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="pagination-container">
            <div class="pagination-info">
                <span id="paginationInfo">Loading...</span>
            </div>
            <div class="pagination-controls">
                <button id="prevBtn" class="pagination-btn" disabled>
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <span id="pageNumbers" class="page-numbers"></span>
                <button id="nextBtn" class="pagination-btn" disabled>
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Bitcoin Data Labs Footer -->
    <div id="footer"></div>

    <!-- Bitcoin Data Labs App Components -->
    <script src="https://bitcoindatalabs.org/components/app-components.js" onerror="this.onerror=null;this.src='https://sorukumar.github.io/Bitcoin-Data-Labs/components/app-components.js'"></script>
    <!-- App Configuration -->
    <script src="scripts/app-config.js"></script>
    
    <!-- Table functionality as ES module -->
    <script type="module" src="scripts/node-rank.js"></script>
</body>

</html>
