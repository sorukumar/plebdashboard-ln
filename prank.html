<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRank – Plebdashboard</title>
    
    <!-- Bitcoin Data Labs styles -->
    <link rel="stylesheet" href="https://sorukumar.github.io/Bitcoin-Data-Labs/styles/styles.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Local styles -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/table.css">
    <link rel="stylesheet" href="styles/components.css">
    
</head>
<body>
    <!-- Bitcoin Data Labs Header -->
    <div id="header"></div>
    
    <div class="main-content">
        <!-- Compact Page Header -->
        <div class="page-header-compact">
            <div class="page-header-main">
                <div class="page-title-group">
                    <h1>PRank</h1>
                    <p>Comprehensive Lightning Network node rankings by Pleb Rank score</p>
                </div>
                <div class="page-nav-compact">
                    <a href="node-explorer.html" class="nav-link-compact" title="Node Explorer">
                        <i class="fas fa-compass"></i>
                        <span>Nodes</span>
                    </a>
                    <a href="channel-explorer.html" class="nav-link-compact" title="Channel Explorer">
                        <i class="fas fa-link"></i>
                        <span>Channels</span>
                    </a>
                    <a href="node-comparison.html" class="nav-link-compact" title="Node Comparison">
                        <i class="fas fa-balance-scale"></i>
                        <span>Comparison</span>
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Table Controls (moved closer to reduce space) -->
        <div class="table-controls">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search by node alias or pubkey..." class="search-input">
                <i class="fas fa-search search-icon"></i>
            </div>
        </div>
        
        <div class="table-container">
            <div id="loading" class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                Loading node ranking data...
            </div>
            <table id="dataTable" class="data-table" style="display: none;">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        
        <div class="pagination-container">
            <div class="pagination-info">
                <span id="paginationInfo">Loading...</span>
            </div>
            <div class="pagination-controls">
                <button id="prevBtn" class="pagination-btn" disabled>
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <span id="pageNumbers" class="page-numbers"></span>
                <button id="nextBtn" class="pagination-btn" disabled>
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Bitcoin Data Labs Footer -->
    <div id="footer"></div>
    
    <!-- Bitcoin Data Labs App Components -->
    <script src="https://sorukumar.github.io/Bitcoin-Data-Labs/components/app-components.js"></script>
    <!-- Hyparquet library -->
    <!-- Table functionality as ES module -->
    <script type="module" src="scripts/table.js"></script>
    <!-- Table functionality -->
    <script src="scripts/table.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            BitcoinLabsAppComponents.init({
                isApp: true,
                appName: "plebdashboard-ln",
                appHomeUrl: "https://sorukumar.github.io/plebdashboard-ln/"
            });
        });
    </script>
</body>
</html>
