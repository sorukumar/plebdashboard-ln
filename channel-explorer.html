<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plebdashboard – Channel Explorer</title>
    
    <!-- Bitcoin Data Labs styles -->
    <link rel="stylesheet" href="https://sorukumar.github.io/Bitcoin-Data-Labs/styles/styles.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Local styles -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/node-explorer.css">
</head>
<body>
    <!-- Bitcoin Data Labs Header -->
    <div id="header"></div>
    
    <div class="main-content">
        <div class="explorer-container">
            <!-- Compact Page Header -->
            <div class="page-header-compact">
                <div class="page-header-main">
                    <div class="page-title-group">
                        <h1>Channel Explorer</h1>
                        <p>Search, filter, and compare Lightning Network channels</p>
                    </div>
                    <div class="page-nav-compact">
                        <a href="prank.html" class="nav-link-compact" title="Node Rankings">
                            <i class="fas fa-chart-bar"></i>
                            <span>Rankings</span>
                        </a>
                        <a href="node-explorer.html" class="nav-link-compact" title="Node Explorer">
                            <i class="fas fa-compass"></i>
                            <span>Nodes</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Channel Explorer Controls -->
            <div class="explorer-controls">
                <div class="controls-row-unified">
                    <!-- Node Search Boxes with Bidirectional Logic -->
                    <div class="search-container">
                        <input type="text" id="node1SearchInput" placeholder="Node 1: Search by alias or pubkey..." class="search-input">
                        <i class="fas fa-search search-icon"></i>
                    </div>
                    
                    <div class="search-divider">
                        <i class="fas fa-arrows-alt-h" title="Channels connect two nodes"></i>
                    </div>
                    
                    <div class="search-container">
                        <input type="text" id="node2SearchInput" placeholder="Node 2: Search by alias or pubkey..." class="search-input">
                        <i class="fas fa-search search-icon"></i>
                    </div>

                    <!-- Sort -->
                    <select id="sortBy" class="filter-select">
                        <option value="capacity:desc">Capacity: High to Low</option>
                        <option value="capacity:asc">Capacity: Low to High</option>
                        <option value="birth_tx:asc">Birth TX: Oldest First</option>
                        <option value="birth_tx:desc">Birth TX: Newest First</option>
                    </select>

                    <!-- View Toggle -->
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="grid" title="Grid View">
                            <i class="fas fa-th-large"></i>
                        </button>
                        <button class="view-btn" data-view="list" title="List View">
                            <i class="fas fa-list"></i>
                        </button>
                    </div>

                    <!-- Reset -->
                    <button id="resetFilters" class="reset-btn">
                        <i class="fas fa-undo"></i>
                    </button>
                </div>
                
                <!-- Search Hint -->
                <div class="search-hint">
                    <i class="fas fa-info-circle"></i>
                    <span>Fill one box to see all channels for that node, or both boxes to find channels between two nodes</span>
                </div>

                <!-- Filter Statistics -->
                <div class="filter-stats">
                    <div id="filterStats">Loading...</div>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="loading-state">
                <div class="loading-content">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading channel data...</p>
                </div>
            </div>

            <!-- Channel Explorer Container -->
            <div id="channelExplorerContainer" class="node-explorer-container grid-view" style="display: none;">
                <div id="channelExplorerGrid" class="node-explorer-grid">
                    <!-- Channels will be populated here -->
                </div>
            </div>

            <!-- Pagination -->
            <div id="paginationContainer" class="pagination-container container" style="display: none;">
                <div class="pagination-info">
                    <span id="paginationText">Showing 1-20 of 0 channels</span>
                </div>
                <div class="pagination-controls">
                    <button id="prevPage" class="pagination-btn" disabled>
                        <i class="fas fa-chevron-left"></i>
                        Previous
                    </button>
                    <div id="pageNumbers" class="page-numbers">
                        <!-- Page numbers will be populated here -->
                    </div>
                    <button id="nextPage" class="pagination-btn">
                        Next
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bitcoin Data Labs Footer -->
    <div id="footer"></div>

    <!-- Bitcoin Data Labs App Components -->
    <script src="https://sorukumar.github.io/Bitcoin-Data-Labs/components/app-components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            BitcoinLabsAppComponents.init({
                isApp: true,
                appName: "plebdashboard-ln",
                appHomeUrl: "https://sorukumar.github.io/plebdashboard-ln/"
            });
        });
    </script>
    
    <!-- Channel Explorer functionality -->
    <script type="module" src="scripts/channel-explorer.js"></script>
</body>
</html>
