<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plebdashboard – Channel Explorer</title>

    <!-- Bitcoin Data Labs styles -->
    <link rel="stylesheet" href="https://bitcoindatalabs.org/styles/styles.css" onerror="this.onerror=null;this.href='https://sorukumar.github.io/Bitcoin-Data-Labs/styles/styles.css'">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Local styles -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/node-explorer.css">
    <link rel="stylesheet" href="styles/node-rank.css">
</head>

<body class="has-fixed-header">
    <!-- Bitcoin Data Labs Header -->
    <div id="header"></div>

    <div class="main-content">
        <div class="explorer-container">
            <!-- Compact Page Header -->
            <div class="page-header-compact">
                <div class="page-header-main">
                    <div class="page-title-group">
                        <h1>Channel Explorer</h1>
                        <p>Search, filter, and compare Lightning Network channels</p>
                    </div>
                </div>
            </div>

            <!-- Channel Explorer Controls -->
            <div class="explorer-controls">
                <div class="controls-row-unified">
                    <!-- Node Search Boxes with Bidirectional Logic -->
                    <div class="search-container">
                        <input type="text" id="node1SearchInput" placeholder="Node 1: Search by alias or pubkey..."
                            class="search-input">
                        <i class="fas fa-search search-icon"></i>
                        <button type="button" class="search-clear-btn" aria-label="Clear search">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>

                    <div class="search-divider">
                        <i class="fas fa-arrows-alt-h" title="Channels connect two nodes"></i>
                    </div>

                    <div class="search-container">
                        <input type="text" id="node2SearchInput" placeholder="Node 2: Search by alias or pubkey..."
                            class="search-input">
                        <i class="fas fa-search search-icon"></i>
                        <button type="button" class="search-clear-btn" aria-label="Clear search">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>

                    <!-- Reset -->
                    <button id="resetFilters" class="reset-btn">
                        <i class="fas fa-undo"></i>
                    </button>
                </div>

                <!-- Search Hint -->
                <div class="search-hint">
                    <i class="fas fa-info-circle"></i>
                    <span>Fill one box to see all channels for that node, or both boxes to find channels between two
                        nodes</span>
                </div>

                <!-- Filter Statistics -->
                <div class="filter-stats">
                    <div id="filterStats">Loading...</div>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="loading-state">
                <div class="loading-content">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading channel data...</p>
                </div>
            </div>

            <!-- Channel Explorer Container -->
            <div id="channelExplorerContainer" class="table-container" style="display: none;">
                <table id="channelTable" class="data-table">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div id="paginationContainer" class="pagination-container container" style="display: none;">
                <div class="pagination-info">
                    <span id="paginationText">Showing 1-20 of 0 channels</span>
                </div>
                <div class="pagination-controls">
                    <button id="prevPage" class="pagination-btn" disabled>
                        <i class="fas fa-chevron-left"></i>
                        Previous
                    </button>
                    <div id="pageNumbers" class="page-numbers">
                        <!-- Page numbers will be populated here -->
                    </div>
                    <button id="nextPage" class="pagination-btn">
                        Next
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bitcoin Data Labs Footer -->
    <div id="footer"></div>

    <!-- Bitcoin Data Labs App Components -->
    <script src="https://bitcoindatalabs.org/components/app-components.js" onerror="this.onerror=null;this.src='https://sorukumar.github.io/Bitcoin-Data-Labs/components/app-components.js'"></script>
    <!-- App Configuration -->
    <script src="scripts/app-config.js"></script>

    <!-- Channel Explorer functionality -->
    <script type="module" src="scripts/channel-explorer.js"></script>
</body>

</html>
